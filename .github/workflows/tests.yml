name: tests

on:
  push:
    paths:
      - "extract_all_tables.py"
      - "serve.py"
      - "telecom_extract.py"
      - "tablekit/**"
      - "tablekit_tests/**"
      - "webui.html"
      - "run_app.bat"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  launcher-sanity:
    # run_app.bat silently pointed at a pre-rewrite, superseded app for an
    # unknown number of commits (see CHANGELOG.md 0.5.0 / archive/README.md)
    # before anyone noticed -- nothing caught that at the time. This is the
    # guardrail so that class of drift fails CI instead of waiting for
    # someone to notice the launcher opens the wrong thing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -q "serve.py" run_app.bat || (echo "run_app.bat no longer launches serve.py" && exit 1)

  lint:
    # Pyflakes only (see pyproject.toml's [tool.ruff.lint] for why) -- real
    # correctness bugs (unused imports/vars, undefined names), not style.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check extract_all_tables.py serve.py telecom_extract.py tablekit/ tablekit_tests/

  frontend-logic:
    # webui.html's PURE logic (i18n lookup/interpolation, number/currency
    # formatting, the risky-table check) -- runs the real inline <script> in
    # a DOM stub, not a browser (see tablekit_tests/js/dom_stub.js for why
    # this project doesn't pull in a browser-automation dependency for
    # rendering/click coverage instead). Zero npm dependencies: Node's own
    # built-in test runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tablekit_tests/js/

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # requirements.txt now includes img2table/opencv-python-headless/pandas
      # (the second geometry engine + manual box-select's primary path) --
      # CI genuinely exercises that code path, not a fallback-only version of it.
      - run: pip install -r requirements.txt pytest

      # Pure-logic suites -- no PDFs needed, so these gate every push:
      #   test_units.py         analyze / health / cross-year / stitch / cash-flow
      #   test_serve.py         inventory shape / edits / one-workbook export
      #   test_manual_mode.py   img2table_backend region merge/select logic,
      #                         serve.py upload/search/_resolve (the PDF-gated
      #                         parts of this file skip cleanly below)
      #   test_golden.py        the parser + reconcile-explain cases
      - name: unit + backend tests (no PDFs needed)
        run: pytest tablekit_tests/test_units.py tablekit_tests/test_serve.py tablekit_tests/test_manual_mode.py -q

      - name: parser + reconcile-explain cases
        run: pytest tablekit_tests/test_golden.py -q -k "parse_number or reconcile_explain or every_snapshot"

      # The full golden snapshot + hand-verified anchors, and the
      # PDF-gated cases in test_manual_mode.py, need the 24 report PDFs,
      # which are not committed -- they run locally and skip in CI.
      - name: golden + anchors + PDF-gated manual-mode cases (skip cleanly if PDFs absent)
        run: pytest tablekit_tests/test_golden.py tablekit_tests/test_manual_mode.py -q
