<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle">Table preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="webui.css">
</head>
<body>
<div id="globalToasts" class="global-toasts"></div>
<header>
  <h1 class="brand">
    <span class="logo-mark">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <rect x="1" y="8" width="3" height="7" rx="1" fill="#fff"/>
        <rect x="6.5" y="4" width="3" height="11" rx="1" fill="#fff"/>
        <rect x="12" y="1" width="3" height="14" rx="1" fill="#fff"/>
      </svg>
    </span>
    <span data-i18n="brand">Tables</span>
  </h1>
  <label class="btn upload-btn" id="uploadBtn"><span data-i18n="upload">Upload PDF</span>
    <input type="file" id="uploadInput" accept="application/pdf">
  </label>
  <select id="fileSel" hidden data-i18n-title="selectFileTitle" title="selected file"></select>
  <span class="count" id="count"></span>
  <span id="engineBadge"></span>
  <button class="btn" id="layoutBtn" data-i18n-title="layoutBtnTitle" title="switch between side-by-side and stacked panes (applies whenever you're viewing a table)" data-i18n="sideBySide">⬌ Side by side</button>
  <span class="spacer"></span>
  <button class="lang-toggle" id="langToggle" title="Switch to Arabic / التبديل إلى العربية" aria-label="Switch to Arabic / التبديل إلى العربية">EN / ع</button>
  <button class="theme-toggle" id="themeToggle" data-i18n-title="themeToggleTitle" title="Switch light/dark mode">
    <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
  </button>
  <input class="txt" id="fileName" placeholder="workbook name" size="20" title="output file name" data-i18n-ph="fileName_ph" data-i18n-title="outputFileTitle">
  <button class="btn-primary" id="exportBtn" disabled data-i18n="export">Export</button>
</header>

<main>
  <aside>
    <div class="barbtns">
      <button class="btn btn-accent" id="pickerBtn" data-i18n-title="selectTableTitle" title="go back to the page picker to draw another box" data-i18n="selectTable">+ Select a table</button>
      <button class="btn" id="selAllStmt" data-i18n="selectAllStatements">Select all statements</button>
      <button class="btn" id="selClear" data-i18n="clearBtn">Clear</button>
    </div>
    <div class="scroll" id="list"><div class="msg" data-i18n="uploadPrompt">Upload a PDF to get started.</div></div>
    <div class="tray" id="tray"></div>
  </aside>
  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" data-i18n-title="dragToResizeTitle" title="drag to resize"></div>
  <section class="preview" id="preview">
    <div class="onboarding" id="onboarding"></div>
  </section>
  <!--
    Once a file is loaded, #preview's content above is replaced by a
    PERSISTENT split: the page picker and whatever table you're currently
    looking at are both always present, arranged by the header's side-by-side
    / stacked toggle -- extracting or clicking a table updates #detailPane in
    place, it doesn't navigate away from the picker.
  -->
</main>

<script src="webui.js"></script>
</body>
</html>
