<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table preview</title>
<style>
  :root{
    --bg:#fff; --bg-soft:#fafafb; --fg:#1a1d23; --muted:#6b7280; --line:#e6e8eb; --line2:#f1f2f4;
    --accent:#4f46e5; --accent-hover:#4338ca; --accent-weak:#eef2ff;
    --ok:#16a34a; --ok-bg:#f0fdf4; --warn:#b45309; --warn-bg:#fffbeb;
    --bad:#b91c1c; --bad-bg:#fef2f2; --none:#9ca3af; --radius:9px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --shadow-md:0 2px 10px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.04);
    --shadow-lg:0 8px 28px rgba(16,24,40,.11),0 2px 6px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg-soft);color:var(--fg);
    font:13px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  ::selection{background:var(--accent-weak)}

  header{display:flex;align-items:center;gap:12px;padding:11px 20px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);
    z-index:8;box-shadow:var(--shadow-sm)}
  header .brand{font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;
    font-size:14.5px;color:var(--fg)}
  header .brand svg{flex:none}
  header .count{color:var(--muted)}
  header select,header input.txt{padding:6px 9px;border:1px solid var(--line);
    border-radius:7px;background:var(--bg);max-width:min(38vw,340px);transition:border-color .12s}
  header select:focus,header input.txt:focus{outline:none;border-color:var(--accent)}
  header input.txt.small{width:112px}
  header .spacer{flex:1}
  .btn{padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:var(--bg);
    font-weight:500;transition:background .12s,border-color .12s,box-shadow .12s}
  .btn:hover{background:var(--line2);border-color:#d8dbe0}
  .btn:active{background:var(--line2);box-shadow:inset 0 1px 2px rgba(16,24,40,.08)}
  .btn:disabled{opacity:.42;cursor:not-allowed;background:var(--bg)}
  .btn:disabled:hover{background:var(--bg);border-color:var(--line)}
  .btn-primary{padding:7px 15px;border:1px solid var(--accent);border-radius:7px;
    background:var(--accent);color:#fff;font-weight:600;box-shadow:var(--shadow-sm);
    transition:background .12s,box-shadow .12s,transform .12s}
  .btn-primary:hover{background:var(--accent-hover);box-shadow:var(--shadow-md)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .btn-accent{border-color:var(--accent);color:var(--accent);background:var(--accent-weak);
    font-weight:600}
  .btn-accent:hover{background:#e0e0fd}
  .upload-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
  .upload-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
  input:disabled,select:disabled{opacity:.42;cursor:not-allowed;background:var(--bg-soft)}

  main{display:flex;height:calc(100vh - 52px);background:var(--bg-soft)}
  aside{flex:0 0 auto;width:310px;min-width:200px;max-width:70vw;background:var(--bg);
    border-right:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
  aside .scroll{overflow-y:auto;flex:1;padding-bottom:20px}
  .splitter{flex:0 0 6px;cursor:col-resize;background:transparent;position:relative}
  .splitter:hover,.splitter.active{background:var(--accent-weak)}
  .splitter::after{content:"";position:absolute;left:2px;top:0;bottom:0;width:1px;background:var(--line)}
  section.preview{flex:1 1 auto;min-width:0;overflow-y:auto;padding:20px 24px 70px}
  @media (max-width:880px){
    main{display:block;height:auto}
    aside{width:auto !important;border-right:none;border-bottom:1px solid var(--line);max-height:44vh}
    .splitter{display:none}
    section.preview{height:auto}
  }

  .barbtns{display:flex;gap:6px;padding:8px 11px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
  .barbtns .btn{font-size:12px;padding:4px 9px}
  .grouphd{padding:14px 15px 5px;font-size:11px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted)}
  .row{display:flex;gap:9px;align-items:flex-start;padding:9px 13px;border-left:3px solid transparent;
    cursor:pointer;transition:background .12s,border-color .12s}
  .row:hover{background:var(--line2)}
  .row.active{background:var(--accent-weak);border-left-color:var(--accent)}
  .row input[type=checkbox]{margin-top:2px;accent-color:var(--accent);width:15px;height:15px}
  .row .body{flex:1;min-width:0}
  .row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .name .tag{color:var(--accent);font-weight:600;font-size:11px;margin-left:5px}
  .row .sub{color:var(--muted);font-size:12px;margin-top:1px}
  .row .meta{display:flex;align-items:center;gap:7px;margin-top:6px;flex-wrap:wrap}
  .pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;letter-spacing:.01em}
  .pill.ok{color:var(--ok);background:var(--ok-bg)}
  .pill.warn{color:var(--warn);background:var(--warn-bg)}
  .pill.bad{color:var(--bad);background:var(--bad-bg)}
  .pill.none{color:var(--none);background:#f3f4f6}
  .hbar{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden;max-width:70px}
  .hbar>i{display:block;height:100%}

  .tray{border-top:1px solid var(--line);background:#fbfbfc;padding:8px 11px 10px;max-height:30vh;overflow:auto}
  .tray h4{margin:0 0 6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .tray .item{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px}
  .tray .item .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tray .item button{border:1px solid var(--line);background:var(--bg);border-radius:5px;
    width:20px;height:20px;line-height:1;padding:0;color:var(--muted)}
  .tray .empty{color:var(--muted);font-size:12px}

  .msg{padding:22px 16px;color:var(--muted)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;
    vertical-align:-2px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .warnbox{margin:11px 13px;padding:9px 11px;border:1px solid #fde68a;background:var(--warn-bg);
    color:var(--warn);border-radius:7px;font-size:12px}

  .empty{color:var(--muted);text-align:center;font-size:13.5px}
  .empty-big{margin-top:12vh;max-width:360px;margin-left:auto;margin-right:auto;line-height:1.6}
  .empty-big::before{content:"";display:block;width:48px;height:48px;margin:0 auto 14px;
    border-radius:13px;
    background-image:
      url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="%234f46e5" stroke-width="1.7"/><path d="M3 9h18M9 3v18" stroke="%234f46e5" stroke-width="1.7"/></svg>'),
      linear-gradient(135deg,var(--accent-weak),#e0e0fd);
    background-repeat:no-repeat,no-repeat;background-position:center,center;
    background-size:24px 24px,cover}
  .pv-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:3px}
  .pv-head h2{font-size:16px;margin:0;letter-spacing:-.01em}
  .pv-head .where{color:var(--muted)}
  .pv-lines{color:var(--muted);font-size:12px;margin:3px 0 12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap}
  .pv-note{margin:0 0 10px;padding:8px 11px;border-radius:7px;font-size:12px;
    background:var(--warn-bg);border:1px solid #fde68a;color:var(--warn)}
  .pv-consist{margin:0 0 10px;padding:8px 11px;border-radius:7px;font-size:12px}
  .pv-consist.ok{background:var(--ok-bg);border:1px solid #bbf7d0;color:var(--ok)}
  .pv-consist.bad{background:var(--bad-bg);border:1px solid #fecaca;color:var(--bad)}

  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
  .toolbar input.sheet{padding:4px 8px;border:1px solid var(--line);border-radius:6px;width:190px}
  .toolbar .hint{color:var(--muted);font-size:12px}

  /* the PERSISTENT split: picker (left/top) + whatever table you're
     currently looking at (right/bottom) -- both always present once a file
     is loaded, arranged by the header's side-by-side/stacked toggle. This
     is deliberately the ONLY split in the UI now (an earlier version had a
     second, nested toggle for the original-PDF-vs-extracted-table cards
     inside the detail pane too -- three-way splits got cramped and the
     nested toggle confusingly only ever affected ONE of the two views, so
     it's gone; that inner pair is always stacked now). */
  .split-region{display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
  .split-region.side-by-side{grid-template-columns:1fr 1fr}
  .split-pane{min-width:0;min-height:0}
  .panes{display:grid;gap:16px}
  .split-region.side-by-side .pagebox{height:min(50vh,560px)}
  .split-region.side-by-side .tablebox{height:min(50vh,560px)}
  /* the old cutoff here was 1100px -- that's WIDER than the sidebar (310px)
     plus a common 1280/1366px laptop screen, so side-by-side silently did
     nothing on completely normal window sizes. Only force stacked when the
     window is genuinely too narrow to split in half at all (matches the
     point where the sidebar itself collapses, at which point section.preview
     takes the FULL window width anyway, not window-minus-sidebar). */
  @media (max-width:620px){
    .split-region.side-by-side{grid-template-columns:1fr}
  }
  .card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    background:var(--bg);box-shadow:var(--shadow-sm)}
  .card>.cap{display:flex;align-items:center;gap:10px;padding:8px 13px;
    border-bottom:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--muted);
    background:var(--bg-soft)}
  .card>.cap .spacer{flex:1}
  .card .mini{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 9px;
    color:var(--fg);font-size:12px;font-weight:500;transition:background .12s}
  .card .mini:hover{background:var(--line2)}
  .pagebox{height:42vh;min-height:160px;max-height:90vh;overflow:auto;background:#f3f4f7;
    text-align:center;resize:vertical}
  .pagebox img{display:block;margin:0 auto;max-width:100%}
  .pagebox.actual img{max-width:none}
  /* picker's own "Actual size" toggle -- overrides the fit-to-width default
     (max-width:100%;height:auto) on BOTH the image and the box-draw canvas,
     so fine print is readable/selectable at full native resolution when you
     need it, with horizontal+vertical scroll instead of a forced shrink.
     wireCanvas()'s coordinate conversion adapts automatically either way,
     since it always measures the canvas's actual displayed vs buffer size. */
  .pagebox.actual .picker-stage img,.pagebox.actual .picker-stage canvas{
    max-width:none;height:auto}

  /* the picker page fits the pane's width, scaled down WITHOUT distorting
     aspect ratio -- height:auto on BOTH the img and the canvas (each has its
     own intrinsic width/height, from the natural image size and from the
     canvas's width/height attributes) lets the browser compute a matching
     height for both from the same width constraint, so they stay pixel-
     aligned with each other. The box-draw math in wireCanvas() converts
     pointer coordinates (reported in this DISPLAYED size) back to the
     canvas's own drawing-buffer resolution (the PDF's native render size)
     before using them for anything -- see toBufferSpace(). */
  .picker-stage{position:relative;display:inline-block;max-width:100%}
  .picker-stage img{display:block;max-width:100%;height:auto}
  .picker-stage canvas{position:absolute;left:0;top:0;max-width:100%;height:auto;
    cursor:crosshair;touch-action:none}
  .pv-head input.pgnum{width:48px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;
    text-align:center}

  .extract-toast{display:flex;align-items:center;gap:10px;margin-bottom:11px;padding:8px 11px;
    border-radius:7px;font-size:12.5px;background:var(--ok-bg);border:1px solid #bbf7d0;color:var(--ok)}
  .extract-toast b{color:var(--fg)}
  .extract-toast .btn{padding:3px 9px;font-size:11.5px;color:var(--fg)}
  .extract-toast .spacer{flex:1}
  .extract-toast .close{border:none;background:none;color:inherit;cursor:pointer;font-size:15px;
    line-height:1;padding:0 2px;opacity:.6}
  .extract-toast .close:hover{opacity:1}
  .extract-toast.toast-error{background:var(--bad-bg);border-color:#fecaca;color:var(--bad)}

  .global-toasts{position:fixed;top:14px;right:16px;z-index:60;display:flex;
    flex-direction:column;gap:8px;width:min(360px,90vw);pointer-events:none}
  .global-toasts .extract-toast{margin-bottom:0;box-shadow:var(--shadow-lg);
    pointer-events:auto;background:var(--bg)}
  .global-toasts .toast-error{background:#fff5f5}

  .modal-backdrop{position:fixed;inset:0;background:rgba(20,20,30,.35);
    display:flex;align-items:center;justify-content:center;z-index:70}
  .modal-box{background:var(--bg);border-radius:12px;box-shadow:var(--shadow-lg);
    width:min(380px,88vw);padding:18px 20px}
  .modal-title{font-weight:700;font-size:14.5px;margin-bottom:8px}
  .modal-body{color:var(--muted);font-size:12.5px;line-height:1.6;margin-bottom:16px;
    white-space:pre-wrap}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px}
  .btn-danger{background:var(--bad);border-color:var(--bad)}
  .btn-danger:hover{background:#a31313}

  .row-del{flex:none;align-self:center;border:none;background:none;color:var(--muted);
    cursor:pointer;font-size:15px;line-height:1;padding:2px 6px;border-radius:5px;
    opacity:0;transition:opacity .1s,background .12s,color .12s}
  .row:hover .row-del{opacity:1}
  .row-del:hover{background:var(--bad-bg);color:var(--bad)}

  .quickfind{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .quickfind .chip{padding:4px 10px;border:1px solid var(--line);border-radius:999px;
    font-size:11.5px;font-weight:500;background:var(--bg);cursor:pointer;transition:background .12s}
  .quickfind .chip:hover{background:var(--accent-weak);border-color:var(--accent)}

  .search-box{display:flex;gap:6px;align-items:center;margin:2px 0 10px}
  .search-box input{flex:1;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
  .search-hits{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:7px;margin-bottom:10px}
  .search-hits .hit{display:flex;gap:8px;align-items:baseline;padding:6px 10px;cursor:pointer;
    border-bottom:1px solid var(--line2);font-size:12px}
  .search-hits .hit:last-child{border-bottom:none}
  .search-hits .hit:hover{background:var(--line2)}
  .search-hits .hit .pg{font-weight:600;color:var(--accent);white-space:nowrap}
  .search-hits .hit .snip{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .search-hits .hit .cnt{color:var(--muted);white-space:nowrap}
  .search-hits mark{background:#fde68a;color:inherit;border-radius:2px;padding:0 1px}

  .tablebox{height:50vh;min-height:120px;max-height:90vh;overflow:auto;resize:vertical}
  table.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
  table.tbl td,table.tbl th{padding:4px 10px;border-bottom:1px solid var(--line2);
    text-align:left;vertical-align:top}
  table.tbl td.rowctl{width:64px;padding:2px 4px;white-space:nowrap;opacity:0;transition:opacity .1s}
  table.tbl tr:hover td.rowctl{opacity:1}
  table.tbl td.rowctl button{border:1px solid var(--line);background:var(--bg);border-radius:4px;
    width:18px;height:18px;line-height:1;padding:0;color:var(--muted);font-size:11px}
  table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.tbl td.delta{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  table.tbl tr.hdr td{background:#f7f8fa;font-weight:600}
  table.tbl tr.total td{font-weight:600}
  table.tbl td.suspect{border-left:2px solid var(--warn);background:var(--warn-bg);cursor:help}
  table.tbl td.figbad{border-left:2px solid var(--bad);background:var(--bad-bg);cursor:help}
  table.tbl td[contenteditable]{outline:none}
  table.tbl td[contenteditable]:focus{background:var(--accent-weak);box-shadow:inset 0 0 0 2px var(--accent)}
  table.tbl td.dirty{background:#fef9c3}

  /* compare panel */
  #compare{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
  #compare .cmp-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  #compare select{padding:4px 8px;border:1px solid var(--line);border-radius:6px}
  #compare .cmp-verdict{font-size:12px;color:var(--muted);margin-bottom:8px}
  #compare table{border-collapse:collapse;width:100%;font-size:12px}
  #compare td,#compare th{padding:3px 9px;border-bottom:1px solid var(--line2)}
  #compare td.num{text-align:right;font-variant-numeric:tabular-nums}
  #compare tr.restated td{background:var(--bad-bg)}
</style>
</head>
<body>
<div id="globalToasts" class="global-toasts"></div>
<header>
  <span class="brand">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none">
      <rect x="2" y="2" width="16" height="16" rx="3.5" stroke="#4f46e5" stroke-width="1.6"/>
      <path d="M2 8h16M7.5 2v16" stroke="#4f46e5" stroke-width="1.6"/>
    </svg>
    Tables
  </span>
  <label class="btn upload-btn" id="uploadBtn">Upload PDF
    <input type="file" id="uploadInput" accept="application/pdf">
  </label>
  <select id="fileSel" hidden></select>
  <span class="count" id="count"></span>
  <span id="engineBadge"></span>
  <button class="btn" id="layoutBtn" title="switch between side-by-side and stacked panes (applies whenever you're viewing a table)">⬌ Side by side</button>
  <span class="spacer"></span>
  <input class="txt" id="fileName" placeholder="workbook name" size="20" title="output file name">
  <button class="btn-primary" id="exportBtn" disabled>Export</button>
</header>

<main>
  <aside>
    <div class="barbtns">
      <button class="btn btn-accent" id="pickerBtn" title="go back to the page picker to draw another box">+ Select a table</button>
      <button class="btn" id="selAllStmt">Select all statements</button>
      <button class="btn" id="selClear">Clear</button>
    </div>
    <div class="scroll" id="list"><div class="msg">Upload a PDF to get started.</div></div>
    <div class="tray" id="tray"></div>
  </aside>
  <div class="splitter" id="splitter" title="drag to resize"></div>
  <section class="preview" id="preview">
    <div class="empty empty-big">Upload a PDF (top left) to browse its pages and draw a box around the table you want.</div>
  </section>
  <!--
    Once a file is loaded, #preview's content above is replaced by a
    PERSISTENT split: the page picker and whatever table you're currently
    looking at are both always present, arranged by the header's side-by-side
    / stacked toggle -- extracting or clicking a table updates #detailPane in
    place, it doesn't navigate away from the picker.
  -->
</main>

<script>
const $ = s => document.querySelector(s);
// side-by-side is the DEFAULT for every table (not opt-in per table) --
// only an explicit prior toggle (stored either way) overrides that default
let _savedSideBySide = true;
try{
  const saved = localStorage.getItem("tk_side_by_side");
  if (saved !== null) _savedSideBySide = saved === "1";
}catch(e){}
const state = {
  files:[], file:null, tables:[], order:[], sel:new Set(),
  active:null, zoom:false, edits:{}, reTimer:null, cmp:null,
  page:1, pageCount:null, box:null, searchQ:"", searchHits:null, quickfind:null,
  sideBySide:_savedSideBySide, pickerZoom:false,
};
const KIND_NAME = {
  "income statement":"Income statement",
  "statement of financial position":"Balance sheet",
  "statement of cash flows":"Cash flow statement",
  "statement of changes in equity":"Statement of changes in equity",
  "note":"Note","table":"Table",
};
const REAL_STMT = new Set(Object.keys(KIND_NAME).filter(k=>k!=="note"&&k!=="table"));
// Render resolution: base DPI-equivalent * the screen's actual pixel
// density, so a retina/high-DPI display doesn't get a 1x-sharp image
// stretched to look soft -- capped to match the server's own ceiling
// (serve.py: 4.5). Box-draw math divides by this same constant, so it
// stays correct regardless of what it resolves to.
const DPR = Math.min(2, window.devicePixelRatio || 1);
const PICKER_SCALE = Math.min(4.5, 2.2 * DPR);
const PREVIEW_SCALE = Math.min(4.5, 2.2 * DPR);
const fmt = v => (typeof v === "number")
  ? v.toLocaleString(undefined,{maximumFractionDigits:2}) : (v ?? "");
const nameOf = t => REAL_STMT.has(t.kind)
  ? KIND_NAME[t.kind] + (t.years && t.years[0] ? ` ${t.years[0]}` : "")
  : (t.title||"").slice(0,46);

function footPill(f, byCol){
  // a per-column verdict is stricter than the summary flag: if ANY checkable
  // column fails, say so, even when another column happens to reconcile
  if (byCol && byCol.length){
    const oks = byCol.map(c=>c.ok);
    if (oks.some(o=>o===false) && oks.some(o=>o===true))
      return `<span class="pill bad">✗ one year doesn't foot</span>`;
    if (oks.every(o=>o===false)) return `<span class="pill bad">✗ no foot</span>`;
    if (oks.some(o=>o===true))   return `<span class="pill ok">✓ foots</span>`;
  }
  if (f === true)  return `<span class="pill ok">✓ foots</span>`;
  if (f === false) return `<span class="pill bad">✗ no foot</span>`;
  return `<span class="pill none">– no check</span>`;
}
function healthBar(h){
  if (h == null) return "";
  const pc = Math.round(h*100);
  const col = h>=.9 ? "var(--ok)" : h>=.75 ? "#65a30d" : "var(--warn)";
  return `<span class="hbar" title="data health ${pc}%"><i style="width:${pc}%;background:${col}"></i></span>`;
}
async function jget(u){ const r = await fetch(u); const j = await r.json();
  if (j && j.error) throw new Error(j.error); return j; }
async function jpost(u,b){ const r = await fetch(u,{method:"POST",
  headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
  const j = await r.json();
  if(!r.ok||j.error){ const err = new Error(j.error||r.statusText); err.body = j; throw err; }
  return j; }

// ------------------------------------------------------ modal / toasts ----
// In-app replacements for native alert()/confirm() -- those are jarring,
// look nothing like the rest of the UI, and (confirm) block the whole page.
function showModal({title, body, okText="Remove", danger=true}){
  return new Promise(resolve=>{
    const host = document.createElement("div");
    host.className = "modal-backdrop";
    host.innerHTML = `
      <div class="modal-box">
        <div class="modal-title">${title}</div>
        <div class="modal-body">${body}</div>
        <div class="modal-actions">
          <button class="btn" data-a="cancel">Cancel</button>
          <button class="btn-primary ${danger?"btn-danger":""}" data-a="ok">${okText}</button>
        </div>
      </div>`;
    document.body.appendChild(host);
    const done = v => { host.remove(); document.removeEventListener("keydown", onKey); resolve(v); };
    host.querySelector('[data-a="cancel"]').onclick = () => done(false);
    host.querySelector('[data-a="ok"]').onclick = () => done(true);
    host.addEventListener("mousedown", e => { if (e.target === host) done(false); });
    const onKey = e => { if (e.key === "Escape") done(false); };
    document.addEventListener("keydown", onKey);
    host.querySelector('[data-a="ok"]').focus();
  });
}
function confirmDialog(msg, okText){
  return showModal({title:"Are you sure?", body:msg, okText:okText||"Remove"});
}
function showErrorToast(msg){
  const host = $("#globalToasts");
  const el = document.createElement("div");
  el.className = "extract-toast toast-error";
  el.innerHTML = `⚠<span class="spacer"></span><button class="close" data-act="dismiss">×</button>`;
  el.insertBefore(document.createTextNode(msg), el.querySelector(".spacer"));
  host.prepend(el);
  el.querySelector('[data-act="dismiss"]').onclick = () => el.remove();
  setTimeout(()=>{ if (el.isConnected) el.remove(); }, 9000);
}
// the OCR failsafe: only ever offered (never run automatically) when a box
// came back with literally no text at all -- see doExtractRegion's catch.
function showOcrOfferToast(bbox){
  const host = $("#globalToasts");
  const el = document.createElement("div");
  el.className = "extract-toast toast-error";
  el.innerHTML = `⚠ No text in that box (looks like a scan).
    <span class="spacer"></span>
    <button class="btn btn-accent" data-act="ocr">OCR this region →</button>
    <button class="close" data-act="dismiss">×</button>`;
  host.prepend(el);
  el.querySelector('[data-act="dismiss"]').onclick = () => el.remove();
  el.querySelector('[data-act="ocr"]').onclick = () => { el.remove(); doExtractRegionOcr(bbox); };
  setTimeout(()=>{ if (el.isConnected) el.remove(); }, 15000);
}

// ---------------------------------------------------------------- boot ----
// controls that do nothing useful (or error) before a file is chosen --
// left fully clickable pre-fix, which used to crash with a raw exception
// when clicked on the empty landing screen
const FILE_GATED_IDS = ["pickerBtn","selAllStmt","selClear"];
function setControlsEnabled(on){
  FILE_GATED_IDS.forEach(id=>{ const el=$("#"+id); if (el) el.disabled = !on; });
}

async function boot(){
  setControlsEnabled(false);
  try{
    const st = await jget("/api/status");
    const b = $("#engineBadge");
    b.innerHTML = st.img2table
      ? `<span class="pill ok" title="Full support: works on borderless / hand-drawn-box tables, not just ruled ones">Borderless tables: full support</span>`
      : `<span class="pill warn" title="pip install img2table opencv-python-headless pandas -- until then, only tables with visible ruling lines extract reliably">Borderless tables: limited</span>`;
  }catch(e){ /* non-critical */ }

function ensureSplitLayout(){
  if ($("#splitRegion")) return;
  $("#preview").innerHTML = `
    <div class="split-region ${state.sideBySide?"side-by-side":""}" id="splitRegion">
      <div class="split-pane" id="pickerPane"></div>
      <div class="split-pane" id="detailPane">
        <div class="empty">Extract a table (drag a box, then click Extract) or pick one from the list on the left to preview it here.</div>
      </div>
    </div>`;
}

async function loadFile(name){
  state.file = name; state.tables = []; state.order = []; state.sel.clear();
  state.active = null; state.edits = {}; state.cmp = null;
  state.page = 1; state.pageCount = null; state.box = null;
  state.searchQ = ""; state.searchHits = null; state.quickfind = null;
  setControlsEnabled(true);
  syncExport(); renderTray();
  $("#fileName").value = name.replace(/\.pdf$/i,"") + " — tables";
  $("#list").innerHTML = `<div class="msg">No tables yet — draw a box on the right to extract one.</div>`;
  ensureSplitLayout();
  $("#detailPane").innerHTML = `<div class="empty">Extract a table (drag a box, then click Extract) or pick one from the list on the left to preview it here.</div>`;
  try{
    const inv = await jget("/api/scan?file="+encodeURIComponent(name));
    state.tables = inv.tables; state.order = inv.tables.map(t=>t.n);
    renderList(inv.warnings||[]);
  }catch(e){ /* nothing extracted for this file yet -- fine */ }
  showPicker();
  // fire-and-forget: a fast text-only pass to point at roughly where the
  // core statements are, so a 100+ page report doesn't leave the user
  // guessing after landing on page 1 (usually a cover with nothing on it)
  jget("/api/quickfind?file="+encodeURIComponent(name)).then(res=>{
    state.quickfind = res.hits || [];
    if (state.file === name) renderQuickfind();
  }).catch(()=>{});
}

function renderList(warnings){
  const t = state.tables;
  $("#count").textContent = t.length ? `${t.length} tables` : "no tables yet";
  let html = "";
  if (warnings && warnings.length)
    html += `<div class="warnbox">${warnings.map(w=>w.replace(/^!!\s*/,"")).join("<br>")}</div>`;
  for (const g of ["Manual selections","Financial statements","Notes","Other tables"]){
    const items = t.filter(x=>x.group===g);
    if (!items.length) continue;
    html += `<div class="grouphd">${g}</div>`;
    for (const x of items){
      const nm = nameOf(x);
      const yrs = x.years.length ? x.years.join("/") : "–";
      const st = x.stitched_from ? ` +p${x.stitched_from}` : "";
      const consBad = x.consistency && x.consistency.mismatch
        ? `<span class="pill bad" title="prior-year column disagrees with ${x.consistency.vs}">${x.consistency.mismatch}≠</span>` : "";
      const canDelete = g === "Manual selections";
      html += `
        <div class="row" data-n="${x.n}">
          <input type="checkbox" data-n="${x.n}" ${state.sel.has(x.n)?"checked":""}>
          <div class="body" data-n="${x.n}">
            <div class="name">${nm}${state.edits[x.n]?'<span class="tag">edited</span>':''}</div>
            <div class="sub">page ${x.page}${st} · ${yrs} · ${x.nrows}×${x.ncols}</div>
            <div class="meta">${footPill(x.foots)} ${healthBar(x.health)}
              ${x.ocr?`<span class="pill warn" title="read by OCR, not the PDF's own text -- double-check the figures">OCR</span>`:``}
              ${x.n_suspect?`<span class="pill warn" title="${x.n_suspect} row(s) look wrong">${x.n_suspect}⚠</span>`:``}
              ${consBad}
              ${x.notes.length?`<span class="pill warn" title="${x.notes.join(' / ')}">!</span>`:``}
            </div>
          </div>
          ${canDelete?`<button class="row-del" data-del="${x.n}" title="remove this extracted table">×</button>`:``}
        </div>`;
    }
  }
  $("#list").innerHTML = html || `<div class="msg">Nothing to show.</div>`;
  $("#list").querySelectorAll(".body").forEach(el=>el.onclick=()=>openTable(+el.dataset.n));
  $("#list").querySelectorAll('input[type=checkbox]').forEach(cb=>
    cb.onchange=()=>toggleSel(+cb.dataset.n, cb.checked));
  $("#list").querySelectorAll('[data-del]').forEach(b=>
    b.onclick=(e)=>{ e.stopPropagation(); deleteManualTable(+b.dataset.del); });
}

async function deleteManualTable(n){
  const ok = await confirmDialog("Remove this extracted table? This can't be undone.");
  if (!ok) return;
  try{
    const inv = await jpost("/api/delete_manual", {file:state.file, n});
    state.tables = inv.tables; state.order = inv.tables.map(t=>t.n);
    state.sel.delete(n); delete state.edits[n];
    syncExport(); renderTray(); renderList(inv.warnings||[]);
    if (state.active === n){
      state.active = null;
      $("#detailPane").innerHTML = `<div class="empty">Extract a table (drag a box, then click Extract) or pick one from the list on the left to preview it here.</div>`;
    }
  }catch(e){ showErrorToast("Couldn't remove that table: "+e.message); }
}

function toggleSel(n,on){
  if (on){ state.sel.add(n); if(!state.order.includes(n)) state.order.push(n); }
  else state.sel.delete(n);
  syncExport(); renderTray();
}
function renderTray(){
  const chosen = state.order.filter(n=>state.sel.has(n));
  const tray = $("#tray");
  if (!chosen.length){ tray.innerHTML = `<h4>Export order</h4><div class="empty">tick tables to add them</div>`; return; }
  tray.innerHTML = `<h4>Export order — ${chosen.length}</h4>` + chosen.map((n,i)=>{
    const t = state.tables.find(x=>x.n===n);
    return `<div class="item" data-n="${n}"><span class="nm">${i+1}. ${nameOf(t)}</span>
      <button data-up="${n}" ${i===0?"disabled":""}>↑</button>
      <button data-down="${n}" ${i===chosen.length-1?"disabled":""}>↓</button>
      <button data-rm="${n}">×</button></div>`;
  }).join("");
  tray.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>moveSel(+b.dataset.up,-1));
  tray.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>moveSel(+b.dataset.down,1));
  tray.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{
    const cb=$(`#list input[data-n="${b.dataset.rm}"]`); if(cb) cb.checked=false;
    toggleSel(+b.dataset.rm,false); renderList([]);
  });
}
function moveSel(n,dir){
  const chosen = state.order.filter(x=>state.sel.has(x));
  const i=chosen.indexOf(n), j=i+dir;
  if (j<0||j>=chosen.length) return;
  [chosen[i],chosen[j]]=[chosen[j],chosen[i]];
  state.order = [...chosen, ...state.order.filter(x=>!state.sel.has(x))];
  renderTray();
}
function syncExport(){
  const b=$("#exportBtn"), n=state.sel.size;
  b.disabled = n===0; b.textContent = n ? `Export ${n} →` : "Export";
}

// --------------------------------------------------------------- picker ----
// Tabula-style manual mode: browse the raw pages of the uploaded file, drag
// a box around the table you want, extract just that region. This is the
// ONLY way to grab a table -- the whole-file automatic detector was removed
// (its false positives/misses weren't reliable enough to ship).
async function showPicker(){
  // NOTE: this only (re)draws the picker pane -- it no longer deselects
  // whatever table is showing in the detail pane, since both are always
  // visible together now (see ensureSplitLayout). "+ Select a table" jumps
  // focus back to the picker without losing your place in the result.
  if (!state.file) return;
  ensureSplitLayout();
  if (state.pageCount == null){
    try{
      const pc = await jget("/api/pagecount?file="+encodeURIComponent(state.file));
      state.pageCount = pc.pages;
    }catch(e){ state.pageCount = 1; }
  }
  renderPicker();
  await loadPickerPage(state.page);
}

function renderPicker(){
  $("#pickerPane").innerHTML = `
    <div class="pv-head">
      <h2>Select a table</h2>
      <span class="where">page
        <input class="pgnum" id="pgNum" value="${state.page}"> of ${state.pageCount||"?"}</span>
      <button class="btn" id="pgPrev" ${state.page<=1?"disabled":""}>‹ Prev</button>
      <button class="btn" id="pgNext" ${state.pageCount&&state.page>=state.pageCount?"disabled":""}>Next ›</button>
    </div>
    <div class="search-box">
      <input id="searchQ" placeholder="Search this PDF's text… (press Enter)" value="${state.searchQ||""}">
      <button class="btn" id="searchBtn">Search</button>
      ${state.searchQ?`<button class="btn" id="searchClear">×</button>`:""}
    </div>
    <div id="searchResults"></div>
    <div id="quickfindRow"></div>
    <div id="extractToasts"></div>
    <div class="pv-lines">Drag a box around the table you want (rows and columns only), then click Extract. You can extract more than one table from the same page.</div>
    <div class="card">
      <div class="cap">Page ${state.page}<span class="spacer"></span>
        <button class="mini" id="pickerZoomBtn">${state.pickerZoom?"Fit width":"Actual size"}</button>
        <button class="btn-primary" id="extractBtn" disabled>Extract this region →</button></div>
      <div class="pagebox ${state.pickerZoom?"actual":""}" id="pickerBox"><div class="picker-stage" id="pickerStage">
        <img id="pgImg"><canvas id="boxCanvas"></canvas>
      </div></div>
    </div>`;
  $("#pgPrev").onclick = ()=>gotoPage(state.page-1);
  $("#pgNext").onclick = ()=>gotoPage(state.page+1);
  $("#pgNum").onchange = e=>gotoPage(parseInt(e.target.value,10)||1);
  $("#extractBtn").onclick = doExtractRegion;
  $("#pickerZoomBtn").onclick = ()=>{
    state.pickerZoom = !state.pickerZoom;
    $("#pickerBox").classList.toggle("actual", state.pickerZoom);
    $("#pickerZoomBtn").textContent = state.pickerZoom ? "Fit width" : "Actual size";
  };
  $("#searchBtn").onclick = runSearch;
  $("#searchQ").onkeydown = e=>{ if (e.key==="Enter"){ e.preventDefault(); runSearch(); } };
  const sc = $("#searchClear");
  if (sc) sc.onclick = ()=>{ state.searchQ=""; state.searchHits=null; renderPicker(); loadPickerPage(state.page); };

function renderQuickfind(){
  const el = $("#quickfindRow");
  if (!el) return;
  const hits = state.quickfind;
  if (hits === null || hits === undefined){
    el.innerHTML = `<div class="quickfind"><span class="msg" style="padding:0">locating the financial statements…</span></div>`;
    return;
  }
  if (!hits.length){ el.innerHTML = ""; return; }
  el.innerHTML = `<div class="quickfind">
    <span class="msg" style="padding:0">Jump to:</span>
    ${hits.map(h=>`<button class="chip" data-pg="${h.page}">${h.label} · p${h.page}</button>`).join("")}
  </div>`;
  el.querySelectorAll(".chip").forEach(b=> b.onclick = ()=>gotoPage(+b.dataset.pg));
}

async function runSearch(){
  const q = $("#searchQ").value.trim();
  state.searchQ = q;
  if (q.length < 2){ $("#searchResults").innerHTML =
    `<div class="msg" style="padding:6px 2px">type at least 2 characters</div>`; return; }
  $("#searchResults").innerHTML = `<div class="msg" style="padding:6px 2px"><span class="spin"></span>searching…</div>`;
  try{
    const res = await jget(`/api/search?file=${encodeURIComponent(state.file)}&q=${encodeURIComponent(q)}`);
    state.searchHits = res.hits;
    renderSearchResults();
    loadPickerPage(state.page);   // re-render the current page with matches highlighted
  }catch(e){ $("#searchResults").innerHTML = `<div class="msg">search failed: ${e.message}</div>`; }
}

function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function markMatches(text, q){
  const esc = text.replace(/</g,"&lt;");
  if (!q) return esc;
  const re = new RegExp("("+escapeRe(q).replace(/</g,"&lt;")+")", "ig");
  return esc.replace(re, "<mark>$1</mark>");
}

function renderSearchResults(){
  const hits = state.searchHits || [];
  const el = $("#searchResults");
  if (!el) return;
  if (!hits.length){ el.innerHTML = `<div class="msg" style="padding:6px 2px">no matches</div>`; return; }
  el.innerHTML = `<div class="search-hits">${hits.map(h=>`
    <div class="hit" data-pg="${h.page}">
      <span class="pg">p${h.page}</span>
      <span class="snip">…${markMatches(h.snippet, state.searchQ)}…</span>
      <span class="cnt">${h.count}×</span>
    </div>`).join("")}</div>`;
  el.querySelectorAll(".hit").forEach(row=>
    row.onclick = ()=>gotoPage(+row.dataset.pg));
}

function gotoPage(n){
  n = Math.max(1, Math.min(state.pageCount||1, n));
  if (n === state.page && $("#pgImg")) return;
  state.page = n; state.box = null;
  renderPicker();
  loadPickerPage(n);
}

async function loadPickerPage(n){
  const img = $("#pgImg");
  let src = `/api/page_raw?file=${encodeURIComponent(state.file)}&n=${n}&scale=${PICKER_SCALE}`;
  if (state.searchQ) src += `&hl=${encodeURIComponent(state.searchQ)}`;
  img.src = src;
  await new Promise(res=>{ img.onload = res; img.onerror = res; });
  const cv = $("#boxCanvas");
  if (!cv) return;   // user navigated away while the image was loading
  // the canvas's DRAWING BUFFER stays at the image's full native resolution
  // (crisp lines) -- it's the DISPLAYED size that's left to CSS (max-width:
  // 100%; height:auto, same as the img), so the page fits the pane instead
  // of forcing horizontal scroll for every single page. wireCanvas()
  // converts pointer coordinates from that displayed size back to this
  // buffer's coordinate space before using them for anything.
  cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  wireCanvas(cv);
}

function wireCanvas(cv){
  const ctx = cv.getContext("2d");
  let drag = null;
  // pointer events report offsetX/offsetY in the canvas's DISPLAYED (CSS)
  // size, which can now be smaller than its drawing-buffer resolution
  // (scaled down to fit the pane) -- convert to buffer space before using.
  const toBuffer = (x, y) => {
    const rx = cv.width / cv.clientWidth, ry = cv.height / cv.clientHeight;
    return [x * rx, y * ry];
  };
  const redraw = (x0,y0,x1,y1)=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    const x=Math.min(x0,x1), y=Math.min(y0,y1), w=Math.abs(x1-x0), h=Math.abs(y1-y0);
    ctx.fillStyle = "rgba(79,70,229,.15)"; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle = "#4f46e5"; ctx.lineWidth = 2; ctx.strokeRect(x,y,w,h);
  };
  cv.onpointerdown = e=>{
    cv.setPointerCapture(e.pointerId);
    const [bx,by] = toBuffer(e.offsetX, e.offsetY);
    drag = {x0:bx, y0:by, dispX0:e.offsetX, dispY0:e.offsetY};
    const eb = $("#extractBtn"); if (eb) eb.disabled = true;
  };
  cv.onpointermove = e=>{
    if (!drag) return;
    const [bx,by] = toBuffer(e.offsetX, e.offsetY);
    redraw(drag.x0, drag.y0, bx, by);
  };
  cv.onpointerup = e=>{
    if (!drag) return;
    // the "too small, ignore it" check is in DISPLAYED pixels (what the user
    // actually dragged), not buffer pixels -- otherwise, once the page is
    // scaled down to fit the pane, a tiny on-screen wiggle could translate
    // to well over the buffer-space threshold and register as a real box
    const dispW = Math.abs(e.offsetX - drag.dispX0), dispH = Math.abs(e.offsetY - drag.dispY0);
    const [bx,by] = toBuffer(e.offsetX, e.offsetY);
    const x0=drag.x0, y0=drag.y0, x1=bx, y1=by;
    drag = null;
    if (dispW < 6 || dispH < 6){ ctx.clearRect(0,0,cv.width,cv.height); return; }
    // state.box stays in the canvas's BUFFER (native render-pixel) space,
    // same as before -- doExtractRegion's ÷PICKER_SCALE conversion is unchanged
    state.box = [Math.min(x0,x1), Math.min(y0,y1), Math.max(x0,x1), Math.max(y0,y1)];
    const eb = $("#extractBtn"); if (eb) eb.disabled = false;
  };
}

async function doExtractRegion(){
  if (!state.box) return;
  const b = $("#extractBtn");
  b.disabled = true; b.textContent = "Extracting…";
  try{
    const pdfBox = state.box.map(v=>v/PICKER_SCALE);
    const d = await jpost("/api/extract_region",
      {file:state.file, page:state.page, bbox:pdfBox});
    await _afterExtract(d);
  }catch(e){
    // OCR is a failsafe the user clicks, never something that fires on its
    // own -- offer it only when the box is genuinely textless (a scan) and
    // the server actually has an OCR engine to run.
    if (e.body && e.body.no_text && e.body.ocr_available){
      showOcrOfferToast(state.box.map(v=>v/PICKER_SCALE));
    } else {
      showErrorToast("Extraction failed: "+e.message);
    }
  } finally {
    const eb = $("#extractBtn");
    if (eb){ eb.disabled = true; eb.textContent = "Extract this region →"; }
  }
}

async function doExtractRegionOcr(pdfBox){
  const b = $("#extractBtn");
  if (b){ b.disabled = true; b.textContent = "Running OCR…"; }
  try{
    const d = await jpost("/api/extract_region_ocr",
      {file:state.file, page:state.page, bbox:pdfBox});
    await _afterExtract(d);
  }catch(e){
    showErrorToast("OCR failed: "+e.message);
  } finally {
    if (b){ b.disabled = true; b.textContent = "Extract this region →"; }
  }
}

async function _afterExtract(d){
  const inv = await jget("/api/scan?file="+encodeURIComponent(state.file));
  state.tables = inv.tables; state.order = inv.tables.map(t=>t.n);
  renderList(inv.warnings||[]);
  state._lastDetail = d;
  // stay on the picker (same page) so another table can be grabbed right
  // away -- clear the box and show a small confirmation. The result also
  // shows up immediately in the detail pane right beside the picker
  // (they're both always on screen now), no click needed to "go look at it".
  state.box = null;
  const cv = $("#boxCanvas");
  if (cv) cv.getContext("2d").clearRect(0,0,cv.width,cv.height);
  showExtractToast(d);
  state.active = d.n;
  $("#list").querySelectorAll(".row").forEach(r=>r.classList.toggle("active", +r.dataset.n===d.n));
  renderPreview(d.n, d, false);
}

function showExtractToast(d){
  const host = $("#extractToasts");
  if (!host) return;
  const el = document.createElement("div");
  el.className = "extract-toast";
  el.innerHTML = `✓ Extracted <b>${(nameOf(d)||"table").replace(/</g,"&lt;")}</b>
    <span class="spacer"></span>
    <button class="btn" data-act="view">View →</button>
    <button class="close" data-act="dismiss" title="dismiss">×</button>`;
  host.prepend(el);
  el.querySelector('[data-act="view"]').onclick = ()=>{
    state.active = d.n;
    $("#list").querySelectorAll(".row").forEach(r=>r.classList.toggle("active", +r.dataset.n===d.n));
    renderPreview(d.n, d, false);
  };
  el.querySelector('[data-act="dismiss"]').onclick = ()=> el.remove();
  setTimeout(()=>{ if (el.isConnected) el.remove(); }, 8000);
}

// -------------------------------------------------------------- preview ----
function baseRows(n, d){
  const e = state.edits[n];
  return (e && e.rows ? e.rows : d.rows).map(r=>r.slice());
}
function pushEdit(n, rows, extra){
  const e = state.edits[n] = Object.assign({dirty:new Set()}, state.edits[n]||{}, extra||{});
  if (rows) e.rows = rows;
  renderList([]);
  scheduleReanalyze(n);
}
function scheduleReanalyze(n){
  clearTimeout(state.reTimer);
  state.reTimer = setTimeout(async ()=>{
    if (state.active !== n) return;
    try{
      const e = state.edits[n] || {};
      const d = await jpost("/api/reanalyze",
        {file:state.file, n, rows:e.rows||null, title:e.title||null});
      state._lastDetail = d;
      renderPreview(n, d, true);
    }catch(err){ /* keep the current view */ }
  }, 450);
}

async function openTable(n){
  state.active = n;
  $("#list").querySelectorAll(".row").forEach(r=>r.classList.toggle("active",+r.dataset.n===n));
  const d = await jget(`/api/table?file=${encodeURIComponent(state.file)}&n=${n}`);
  state._lastDetail = d;
  renderPreview(n, d, false);
}

function renderPreview(n, d){
  const nm = KIND_NAME[d.kind]||"Table";
  const yrs = d.years.length ? d.years.join(" / ") : "";
  const ed = state.edits[n];
  const rows = baseRows(n, d);
  const dirty = (ed && ed.dirty) || new Set();
  const hi=d.header_idx, ds=d.data_start, vc=d.value_cols||[], tot=new Set(d.total_rows||[]);
  const susp={}; (d.suspect||[]).forEach(s=>susp[s.row]=s);
  const showDelta = vc.length>=2;
  const ncols = Math.max(...rows.map(r=>r.length), 1);

  let bodyRows = "";
  rows.forEach((r,i)=>{
    const isHdr=i<=hi, di=i-ds;
    const cls=[isHdr?"hdr":"", tot.has(i)?"total":""].filter(Boolean).join(" ");
    let tds = `<td class="rowctl">`+
      `<button data-act="ins" data-i="${i}" title="insert row below">＋</button>`+
      `<button data-act="del" data-i="${i}" title="delete row">✕</button>`+
      `<button data-act="split" data-i="${i}" title="split label at the middle">⤶</button>`+
      `<button data-act="mergeup" data-i="${i}" title="merge into row above" ${i===0?"disabled":""}>⭡</button></td>`;
    for (let ci=0; ci<ncols; ci++){
      const c=r[ci], num=typeof c==="number";
      let kl = num ? "num" : "";
      if (ci===0 && !isHdr && susp[di]) kl += susp[di].kind==="figure" ? " figbad" : " suspect";
      if (dirty.has(i+","+ci)) kl += " dirty";
      const title = (ci===0 && susp[di]) ? ` title="${susp[di].why}"` : "";
      tds += `<td class="${kl}"${title} data-r="${i}" data-c="${ci}" contenteditable="plaintext-only">${fmt(c)}</td>`;
    }
    if (showDelta && !isHdr){
      const a=r[vc[0]], b=r[vc[1]];
      if (typeof a==="number" && typeof b==="number"){
        const dd=a-b, pc=b?(100*dd/Math.abs(b)):null;
        tds += `<td class="delta">${dd.toLocaleString()}</td><td class="delta">${pc==null?"":pc.toFixed(1)+"%"}</td>`;
      } else tds += `<td class="delta"></td><td class="delta"></td>`;
    } else if (showDelta){
      tds += `<td class="delta">Δ</td><td class="delta">Δ%</td>`;
    }
    bodyRows += `<tr class="${cls}">${tds}</tr>`;
  });

  const consist = d.consistency ? (()=>{
    const c=d.consistency, ok=c.mismatch===0;
    const worst=(c.worst||[]).map(w=>`${w[0]}: ${Number(w[1]).toLocaleString()} vs ${Number(w[2]).toLocaleString()}`).join(" · ");
    const tail = ok ? "agree ✓"
      : `${c.mismatch} of ${c.checked} differ — <b>${c.verdict||"differs"}</b>`;
    return `<div class="pv-consist ${ok?"ok":"bad"}">prior-year (${c.year}) column vs <b>${c.vs}</b>:
       ${tail}${worst?` — ${worst}`:""}</div>`;
  })() : "";
  const notes = (d.notes||[]).map(x=>`<div class="pv-note">${x}</div>`).join("");
  const lines = (d.foot_by_col||[]).map(fc=>{
    const m=fc.ok===true?"✓":fc.ok===false?"✗":"?"; return `${fc.year} ${m}  ${fc.worked}`;
  }).join("\n") || d.foot_detail || "";

  ensureSplitLayout();
  $("#detailPane").innerHTML = `
    <div class="pv-head">
      <h2>${nm}${yrs?` <span class="where">· ${yrs}</span>`:""}</h2>
      <span class="where">page ${d.page}</span>
      ${footPill(d.foots, d.foot_by_col)}
      <span class="where">labels ${Math.round((d.health_labels??1)*100)}% · figures ${Math.round((d.health_figures??1)*100)}%</span>
      ${d.ocr?`<span class="pill warn" title="read by OCR, not the PDF's own text -- double-check the figures">OCR — verify by eye</span>`:``}
      ${d.edited?`<span class="pill warn">edited — verdict recomputed</span>`:``}
    </div>
    ${notes}${consist}
    <div class="pv-lines">${lines}</div>

    <div class="toolbar">
      <input class="sheet" id="sheetName" placeholder="sheet name (optional)" value="${(ed&&ed.title)||""}">
      ${vc.length>=2?`<button class="btn" id="swapYears">Swap year columns</button>`:""}
      ${ed?`<button class="btn" id="resetEdits">Undo my edits</button>`:""}
      <span class="hint">click a cell to fix it · hover a row for ＋ ✕ ⤶ ⭡ · exports use your version</span>
    </div>

    <div class="card">
      <div class="cap">Extracted table — ${rows.length} rows
        ${(d.suspect||[]).length?`<span class="spacer"></span><span style="color:var(--warn)">amber/red = review</span>`:``}
      </div>
      <div class="tablebox"><table class="tbl"><tbody>${bodyRows}</tbody></table></div>
    </div>

    <div id="compare"></div>`;

  // the picker (right there in the OTHER pane) is now the only PDF preview --
  // no more redundant second copy of the same page. Just make sure it's
  // actually showing the page this table came from (a no-op if it already is).
  if (state.page !== d.page) gotoPage(d.page);

  wirePreview(n, d);
  renderComparePanel(n, d);
}

function wirePreview(n, d){
  $("#sheetName").oninput = e => pushEdit(n, null, {title:e.target.value});
  const sy=$("#swapYears"); if(sy) sy.onclick=()=>{
    const rows=baseRows(n,d); const [a,b]=d.value_cols;
    rows.forEach(r=>{const t=r[a];r[a]=r[b];r[b]=t;});
    pushEdit(n, rows); openTable(n);
  };
  const re=$("#resetEdits"); if(re) re.onclick=()=>{ delete state.edits[n]; renderList([]); openTable(n); };

  $("#detailPane").querySelectorAll("td[contenteditable]").forEach(td=>{
    td.addEventListener("blur", ()=>commitCell(n, d, +td.dataset.r, +td.dataset.c, td));
    td.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); td.blur(); }});
  });
  $("#detailPane").querySelectorAll("td.rowctl button").forEach(b=>{
    b.onclick = ()=> rowAction(n, d, b.dataset.act, +b.dataset.i);
  });
}

function commitCell(n, d, r, c, td){
  const rows = baseRows(n, d);
  const raw = td.textContent.trim();
  if (String(rows[r][c] ?? "") === raw) return;
  rows[r][c] = raw;                       // keep the RAW string; server parses it
  const e = state.edits[n] = Object.assign({dirty:new Set()}, state.edits[n]||{});
  e.rows = rows; e.dirty.add(r+","+c);
  renderList([]);
  scheduleReanalyze(n);
}

function rowAction(n, d, act, i){
  let rows = baseRows(n, d);
  if (act === "ins"){
    rows.splice(i+1, 0, new Array(Math.max(...rows.map(x=>x.length),1)).fill(""));
  } else if (act === "del"){
    rows.splice(i, 1);
  } else if (act === "mergeup" && i>0){
    const lab = [rows[i-1][0], rows[i][0]].filter(Boolean).join(" ").trim();
    // keep the figures from whichever row has them
    const figs = rows[i].slice(1).some(v=>v!=="" && v!=null) ? rows[i] : rows[i-1];
    rows[i-1] = [lab, ...figs.slice(1)];
    rows.splice(i, 1);
  } else if (act === "split"){
    const lab = String(rows[i][0]||"");
    const words = lab.split(/\s+/);
    if (words.length >= 2){
      const mid = Math.ceil(words.length/2);
      const top = [words.slice(0,mid).join(" "), ...rows[i].slice(1)];
      const bot = [words.slice(mid).join(" "), ...rows[i].slice(1).map(()=>"")];
      rows.splice(i, 1, top, bot);
    }
  }
  pushEdit(n, rows);
  const d2 = state._lastDetail;
  renderPreview(n, d2, true);
}

// -------------------------------------------------------------- compare ----
function renderComparePanel(n, d){
  const el = $("#compare");
  if (state.files.length < 2){ el.innerHTML = ""; return; }
  const others = state.files.filter(f=>f!==state.file);
  el.innerHTML = `
    <div class="cmp-head"><b>Compare</b>
      <span class="where">this table vs the same statement in</span>
      <select id="cmpFile">${others.map(f=>`<option>${f}</option>`).join("")}</select>
      <button class="btn" id="cmpRun">Compare →</button></div>
    <div id="cmpOut"></div>`;
  $("#cmpRun").onclick = async ()=>{
    const bfile = $("#cmpFile").value;
    $("#cmpOut").innerHTML = `<div class="msg"><span class="spin"></span>scanning ${bfile} & matching…</div>`;
    try{
      const binv = await jget("/api/scan?file="+encodeURIComponent(bfile));
      const match = binv.tables.find(t=>t.kind===d.kind);
      if (!match){ $("#cmpOut").innerHTML = `<div class="msg">no ${KIND_NAME[d.kind]} found in ${bfile}</div>`; return; }
      const cmp = await jpost("/api/compare",{a:state.file,na:n,b:bfile,nb:match.n});
      const hdr = cmp.rows[0];
      let rowsHtml = "";
      for (let r=1;r<cmp.rows.length;r++){
        const row = cmp.rows[r];
        const restated = row[7] ? " restated" : "";
        rowsHtml += `<tr class="${restated}">` + row.map((v,ci)=>
          `<td class="${(ci>=1&&ci<=6&&typeof v==='number')?'num':''}">${v==null?"":(typeof v==='number'?v.toLocaleString():v)}</td>`
        ).join("") + `</tr>`;
      }
      $("#cmpOut").innerHTML = `<div class="cmp-verdict">${cmp.verdict}</div>
        <div style="max-height:44vh;overflow:auto"><table>
          <thead><tr>${hdr.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
          <tbody>${rowsHtml}</tbody></table></div>`;
    }catch(e){ $("#cmpOut").innerHTML = `<div class="msg">compare failed: ${e.message}</div>`; }
  };
}

// ---------------------------------------------------------------- header ----
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(String(r.result).split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
$("#uploadInput").onchange = async (e)=>{
  const f = e.target.files[0]; if (!f) return;
  const btn = $("#uploadBtn"); const oldText = btn.firstChild.textContent;
  btn.firstChild.textContent = "Uploading…";
  try{
    const data_b64 = await fileToBase64(f);
    const res = await jpost("/api/upload", {filename:f.name, data_b64});
    if (!state.files.includes(res.file)) state.files.push(res.file);
    const sel = $("#fileSel");
    sel.innerHTML = state.files.map(n=>`<option>${n}</option>`).join("");
    sel.value = res.file; sel.hidden = state.files.length <= 1;
    await loadFile(res.file);
  }catch(err){ showErrorToast("Upload failed: "+err.message); }
  finally{ btn.firstChild.textContent = "Upload PDF"; e.target.value = ""; }
};

$("#pickerBtn").onclick = ()=>showPicker();

// always-visible header control (not tied to any one table's view) --
// arranges the PERSISTENT picker+detail split (#splitRegion) -- both panes
// are always present once a file is loaded, so this always has something
// visible to change, regardless of what's currently in the detail pane
function setLayoutBtnLabel(){
  $("#layoutBtn").textContent = state.sideBySide ? "⬍ Stack panes" : "⬌ Side by side";
}
setLayoutBtnLabel();
$("#layoutBtn").onclick = ()=>{
  state.sideBySide = !state.sideBySide;
  try{ localStorage.setItem("tk_side_by_side", state.sideBySide ? "1" : "0"); }catch(e){}
  setLayoutBtnLabel();
  const split = $("#splitRegion");
  if (split) split.classList.toggle("side-by-side", state.sideBySide);
};
$("#selAllStmt").onclick = ()=>{
  state.tables.filter(t=>REAL_STMT.has(t.kind)).forEach(t=>toggleSel(t.n,true));
  renderList([]);
};
$("#selClear").onclick = ()=>{ state.sel.clear(); syncExport(); renderTray(); renderList([]); };

$("#exportBtn").onclick = async ()=>{
  const ns = state.order.filter(n=>state.sel.has(n));
  const risky = ns.map(n=>state.tables.find(t=>t.n===n))
    .filter(t=>t.foots===false || (t.health!=null && t.health<0.75));
  if (risky.length){
    const ok = await confirmDialog(
      `${risky.length} of the ${ns.length} selected table(s) have a warning `
      + `(NO FOOT or low data-health):\n\n`
      + risky.map(t=>"  • "+nameOf(t)).join("\n")
      + `\n\nExport anyway?`, "Export anyway");
    if (!ok) return;
  }
  const edits = {};
  for (const n of ns){ const e=state.edits[n];
    if (e && (e.rows||e.title)) edits[n] = {rows:e.rows||null, title:e.title||null}; }
  const b=$("#exportBtn"); b.disabled=true; b.textContent="Building…";
  try{
    const res = await fetch("/api/export",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({file:state.file, ns, edits})});
    if(!res.ok) throw new Error((await res.json()).error||res.statusText);
    const blob = await res.blob();
    let fn = ($("#fileName").value.trim()||"tables").replace(/[^\w .()-]/g,"_");
    if(!/\.xlsx$/i.test(fn)) fn += ".xlsx";
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fn; a.click();
    URL.revokeObjectURL(a.href);
  }catch(e){ showErrorToast("Export failed: "+e.message); }
  syncExport();
};

// ------------------------------------------------------------- splitter ----
// Adjustable panel widths: drag the splitter to resize the sidebar; the
// page-picker and table panes below use native CSS `resize` (drag their
// bottom-right corner) since each already scrolls independently.
(function(){
  const aside = document.querySelector("aside"), split = $("#splitter");
  try{
    const saved = localStorage.getItem("tk_sidebar_w");
    if (saved) aside.style.width = saved+"px";
  }catch(e){}
  let dragging = false;
  split.addEventListener("mousedown", e=>{
    dragging = true; split.classList.add("active");
    e.preventDefault();
  });
  window.addEventListener("mousemove", e=>{
    if (!dragging) return;
    const w = Math.max(200, Math.min(window.innerWidth*0.7, e.clientX));
    aside.style.width = w+"px";
  });
  window.addEventListener("mouseup", ()=>{
    if (!dragging) return;
    dragging = false; split.classList.remove("active");
    try{ localStorage.setItem("tk_sidebar_w", parseInt(aside.style.width,10)); }catch(e){}
  });
})();

document.addEventListener("keydown", e=>{
  if (["INPUT","TD","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
  if (!state.tables.length) return;
  const ord = state.tables.map(t=>t.n);
  const i = ord.indexOf(state.active);
  if (e.key==="ArrowDown"||e.key==="j"){ e.preventDefault(); openTable(ord[Math.min(ord.length-1,i+1)] ?? ord[0]); }
  else if (e.key==="ArrowUp"||e.key==="k"){ e.preventDefault(); openTable(ord[Math.max(0,i-1)] ?? ord[0]); }
  else if (e.key===" " && state.active!=null){ e.preventDefault();
    const cb=$(`#list input[data-n="${state.active}"]`); if(cb){ cb.checked=!cb.checked; toggleSel(state.active,cb.checked); } }
});

boot();
</script>
