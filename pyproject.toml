[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tablekit"
version = "0.4.0"
description = "Generic financial-statement table extractor for digital-text PDFs, with an arithmetic-reconciliation trust layer and a local preview/edit/export UI (automatic whole-document scan or Tabula-style manual box selection)."
readme = "EXTRACT_ALL_TABLES.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11,<0.13",
    "openpyxl>=3.1,<4",
    "pypdfium2>=4",
    "img2table>=1.3",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# manual box-select's "OCR this region" failsafe for a textless box (a scan).
# Also needs the Tesseract binary installed separately -- pip alone isn't
# enough on Windows: https://github.com/UB-Mannheim/tesseract/wiki
ocr = ["pytesseract>=0.3"]

[project.scripts]
extract-tables = "extract_all_tables:main"
tablekit-serve = "serve:_cli"

[tool.setuptools]
py-modules = ["extract_all_tables", "serve", "telecom_extract"]
packages = ["tablekit"]

[tool.pytest.ini_options]
testpaths = ["tablekit_tests"]
addopts = "-q"
