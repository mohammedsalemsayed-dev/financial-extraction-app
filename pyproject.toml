[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tablekit"
version = "0.7.6"
description = "Generic financial-statement table extractor for digital-text PDFs, with an arithmetic-reconciliation trust layer and a local preview/edit/export UI (Tabula-style manual box selection, with an OCR failsafe for scanned regions; whole-document auto-scan is also available via the CLI)."
readme = "EXTRACT_ALL_TABLES.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11,<0.13",
    "openpyxl>=3.1,<4",
    "pypdfium2>=4",
    "img2table>=1.3",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "hypothesis>=6"]
# manual box-select's "OCR this region" failsafe for a textless box (a scan).
# Also needs the Tesseract binary installed separately -- pip alone isn't
# enough on Windows: https://github.com/UB-Mannheim/tesseract/wiki
ocr = ["pytesseract>=0.3"]
# optional page-label lookups (telecom_extract.load_page_labels, used by the
# --list/--audit CLI's printed page numbers); HAVE_PYPDF-gated, so silently
# skipped if absent, not a core dependency
labels = ["pypdf>=4"]

[tool.ruff]
# archive/ is kept for reference only, not part of the running app (see
# archive/README.md) -- linting it would just be noise on code no one edits.
extend-exclude = ["archive"]

[tool.ruff.lint]
# Pyflakes only (real correctness bugs: unused imports/vars, undefined
# names) -- deliberately NOT ruff's broader rulesets (pycodestyle style
# nits, refurb/perf/pylint-refactor suggestions): this codebase has its own
# established conventions (short reused names like `t` for "table",
# semicolon-joined one-liners) that those rulesets fight without catching
# any actual bug.
select = ["F"]

[tool.mypy]
# Gradual, not strict: this codebase has zero type annotations by design
# (it grew organically, fast) -- demanding full annotation coverage
# (disallow_untyped_defs etc.) would produce thousands of findings on code
# nobody's touching, which trains people to ignore the tool rather than
# read it. ignore_missing_imports because img2table/pypdfium2/opencv don't
# ship stubs. Run as-is first: 15 real findings, all either a genuinely
# missing var-annotation (3, now added) or an intentional pattern mypy
# can't see is deliberate (an optional-dependency None-sentinel, a
# fallback-stub with a loose *a/**k signature) -- both now have a scoped
# `# type: ignore[<code>]` with a comment explaining why, not a blanket
# ignore. Re-running finds zero -- this stays meaningful as new code is
# added specifically because nothing here is silenced wholesale.
ignore_missing_imports = true
exclude = ["^archive/", "^\\.design-mockup/"]

[project.scripts]
extract-tables = "extract_all_tables:main"
tablekit-serve = "serve:_cli"

[tool.setuptools]
py-modules = ["extract_all_tables", "serve", "telecom_extract"]
packages = ["tablekit"]

[tool.pytest.ini_options]
testpaths = ["tablekit_tests"]
addopts = "-q"

[tool.coverage.run]
source = ["extract_all_tables", "serve", "telecom_extract", "tablekit"]
omit = ["archive/*", "tablekit_tests/*"]
